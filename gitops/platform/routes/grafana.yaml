apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: platform-gw
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - grafana.localtest.me
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
