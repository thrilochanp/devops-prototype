# orders-api SLO dashboard, provisioned by the Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-orders-api
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  orders-api.json: |
    {
      "uid": "orders-api",
      "title": "orders-api SLOs",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "devops-prototype"
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "custom",
            "query": "orders-dev,orders-prod",
            "current": {
              "text": "orders-dev",
              "value": "orders-dev"
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability (1h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "orders:availability:ratio_rate1h{namespace=\"$namespace\"}"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "p95 latency (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.3
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Requests per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\"}[5m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Running pods",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{namespace=\"$namespace\",service=\"orders-api\"})"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests by status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Error ratio (5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=\"$namespace\"}[5m])), 1e-9)",
              "legendFormat": "error ratio"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Requests by route",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (route) (rate(http_requests_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "{{route}}"
            }
          ]
        }
      ]
    }
