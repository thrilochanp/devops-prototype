apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require requests and memory limits
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Without requests the scheduler cannot place pods sensibly; without a memory limit one pod
      can starve the node. Both are also what OpenCost uses to allocate cost.
spec:
  background: true
  rules:
    - name: require-cpu-memory-requests-and-memory-limit
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["orders-*"]
      validate:
        failureAction: Enforce
        message: "Every container needs resources.requests.cpu, resources.requests.memory and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
