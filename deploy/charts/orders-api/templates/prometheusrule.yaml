{{- if and .Values.metrics.rules.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") }}
{{- $ns := .Release.Namespace }}
{{- $svc := include "orders-api.fullname" . }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $svc }}-slo
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
spec:
  groups:
    - name: {{ $svc }}.slo
      rules:
        - record: orders:availability:ratio_rate1h
          expr: |
            1 - (
              sum(rate(http_requests_total{namespace="{{ $ns }}",service="{{ $svc }}",status=~"5.."}[1h]))
              /
              clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}",service="{{ $svc }}"}[1h])), 1e-9)
            )
          labels:
            namespace: {{ $ns }}

        - alert: OrdersHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ $ns }}",service="{{ $svc }}",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}",service="{{ $svc }}"}[5m])), 1e-9)
            > {{ .Values.metrics.rules.errorRateThreshold }}
          for: 2m
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            summary: "orders-api in {{ $ns }} is returning more than {{ mulf .Values.metrics.rules.errorRateThreshold 100 }}% errors"
            runbook: "Check recent deploys in Argo CD, then logs in Grafana Explore: {namespace=\"{{ $ns }}\"} |= \"status\""

        - alert: OrdersHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ $ns }}",service="{{ $svc }}"}[5m]))
            ) > {{ .Values.metrics.rules.latencyP95Seconds }}
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            summary: "orders-api p95 latency in {{ $ns }} is above {{ .Values.metrics.rules.latencyP95Seconds }}s"

        - alert: OrdersDown
          expr: absent(up{namespace="{{ $ns }}",service="{{ $svc }}"} == 1)
          for: 2m
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            summary: "No healthy orders-api target in {{ $ns }}"
{{- end }}
