[project]
name = "orders-api"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S311"]  # random is fine for chaos injection, not crypto

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest works
